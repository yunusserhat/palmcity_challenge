[project]
name = "palmcity-worf"
version = "0.1.0"
description = "Reproducible PalmCity challenge training, evaluation and probability ensembles"
license = "GPL-3.0-only"
authors = [{ name = "Yunus Serhat Bıçakçı" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "scipy==1.17.1",
  "segmentation-models-pytorch==0.5.0",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers==5.5.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
